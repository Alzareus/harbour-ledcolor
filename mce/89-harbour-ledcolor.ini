# Installed once by the harbour-ledcolor RPM. This file is static:
# nothing on the phone ever rewrites it. mce loads it at startup like
# any vendor file.
#
# Test patterns: color-picker preview, auto-off after 6 s.
# Color patterns: activated and deactivated at runtime over D-Bus by
# the user service (notifywatch.sh), never on their own.
[LEDPatternHybris]
PatternHarbourLedcolorTestRed=50;1;6;500;1500;ff0000
PatternHarbourLedcolorTestGreen=50;1;6;500;1500;00ff00
PatternHarbourLedcolorTestBlue=50;1;6;500;1500;0000ff
PatternHarbourLedcolorTestYellow=50;1;6;500;1500;ffff00
PatternHarbourLedcolorTestCyan=50;1;6;500;1500;00ffff
PatternHarbourLedcolorTestMagenta=50;1;6;500;1500;ff00ff
PatternHarbourLedcolorTestWhite=50;1;6;500;1500;ffffff
PatternHarbourLedcolorRed=5;1;0;500;1500;ff0000
PatternHarbourLedcolorGreen=5;1;0;500;1500;00ff00
PatternHarbourLedcolorBlue=5;1;0;500;1500;0000ff
PatternHarbourLedcolorYellow=5;1;0;500;1500;ffff00
PatternHarbourLedcolorCyan=5;1;0;500;1500;00ffff
PatternHarbourLedcolorMagenta=5;1;0;500;1500;ff00ff
PatternHarbourLedcolorWhite=5;1;0;500;1500;ffffff
