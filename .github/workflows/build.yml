name: Build RPM

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y rpm shellcheck

      - name: Lint shell
        run: shellcheck -s sh -S warning libexec/notifywatch.sh build.sh

      - name: Check tag matches spec version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="$(sed -n 's/^Version:[[:space:]]*//p' rpm/harbour-ledcolor.spec)"
          r="$(sed -n 's/^Release:[[:space:]]*//p' rpm/harbour-ledcolor.spec)"
          [ "v$v-$r" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != spec v$v-$r"; exit 1; }

      - name: Build
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: build/*.rpm

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fixed-name copy so that .../releases/latest/download/harbour-ledcolor.noarch.rpm
          # always points to the newest build (link used in the README).
          cp build/harbour-ledcolor-*.noarch.rpm build/harbour-ledcolor.noarch.rpm
          gh release create "$GITHUB_REF_NAME" build/*.rpm \
            --title "$GITHUB_REF_NAME" --generate-notes --latest
